<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shader DOM</title>
  <script>
    (function() {
      var t = localStorage.getItem("theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <style>
    /* Interactive overlay: opacity: 0 always.
       getComputedStyle returns real values, hover/transitions work.
       Selection highlight is rendered via JS (getClientRects). */
    .interactive-overlay {
      opacity: 0;
    }
    .interactive-overlay button {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
